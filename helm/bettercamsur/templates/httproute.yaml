{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bettercamsur.fullname" . }}
  {{- with .Values.gateway.annotations }}annotations: {{- toYaml . | nindent 4 }}{{- end }}
spec:
  parentRefs: {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames: {{- toYaml .Values.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ include "bettercamsur.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
