replicaCount: 2
image:
  repository: ghcr.io/REPLACE_GITHUB_OWNER/bettercamsur
  tag: "latest"
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: [ALL]
service:
  type: ClusterIP
  port: 3000
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: bettercamsur.ph
      paths:
        - path: /
          pathType: Prefix
  tls: []
gateway:
  enabled: false
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
  hostnames:
    - bettercamsur.ph
  annotations: {}
  sectionName: https
resources:
  requests: {cpu: 200m, memory: 256Mi}
  limits: {cpu: "2", memory: 1Gi}
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
podDisruptionBudget:
  enabled: true
  minAvailable: 1
existingSecret: bettercamsur-runtime
env:
  APP_BASE_URL: https://bettercamsur.ph
  NODE_ENV: production
  PORT: "3000"
  KEYCLOAK_URL: https://sso.mitaka.quest
  KEYCLOAK_REALM: bettercamsur
  KEYCLOAK_CLIENT_ID: bettercamsur-web
  KEYCLOAK_ADMIN_CLIENT_ID: bettercamsur-provisioner
  S3_ENDPOINT: https://s3.mitaka.quest
  S3_PUBLIC_URL: https://evidence.bettercamsur.ph
  S3_REGION: us-east-1
  S3_BUCKET: bettercamsur-evidence
  S3_FORCE_PATH_STYLE: "true"
  SMTP_HOST: smtp.example.net
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_FROM: "bettercamsur.ph <notifications@bettercamsur.ph>"
  PG_POOL_MAX: "15"
  PG_SSL: "false"
