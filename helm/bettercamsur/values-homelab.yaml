# Homelab values: Emissary Ingress + Cloudflare Tunnel.
# PostgreSQL and Redis are separate Bitnami Helm releases in this namespace.
replicaCount: 2

image:
  repository: ghcr.io/phlopentechcommunity/bettercamsur
  tag: "sha-7652c0c"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

# Do not enable Gateway API: this cluster has no GatewayClass/Gateway.
gateway:
  enabled: false

# Use the Emissary Mapping CRD rather than a generic Ingress resource.
ingress:
  enabled: false

emissary:
  enabled: true
  hostname: bettercamsur.ph
  prefix: /
  servicePort: 3000
  timeoutMs: 30000

existingSecret: bettercamsur-runtime

env:
  APP_BASE_URL: https://bettercamsur.ph
  NODE_ENV: production
  PORT: "3000"
  KEYCLOAK_URL: https://sso.mitaka.quest
  KEYCLOAK_REALM: bettercamsur
  KEYCLOAK_CLIENT_ID: bettercamsur-web
  KEYCLOAK_ADMIN_CLIENT_ID: bettercamsur-provisioner
  S3_ENDPOINT: https://s3.mitaka.quest
  S3_PUBLIC_URL: https://evidence.bettercamsur.ph
  S3_REGION: us-east-1
  S3_BUCKET: bettercamsur-evidence
  S3_FORCE_PATH_STYLE: "true"
  SMTP_HOST: REPLACE_WITH_YOUR_SMTP_HOST
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_FROM: "bettercamsur.ph <notifications@bettercamsur.ph>"
  PG_POOL_MAX: "15"
  PG_SSL: "false"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1
