name: Build and publish bettercamsur.ph

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build and publish application image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${OWNER}/bettercamsur" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (pull requests)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Validate and publish Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Validate chart
        run: |
          helm lint ./helm/bettercamsur
          helm template bettercamsur ./helm/bettercamsur \
            --set image.repository=ghcr.io/example/bettercamsur \
            --set image.tag=ci

      - name: Log in to GHCR as OCI registry
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Package and publish chart
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          BASE_VERSION="$(awk '/^version:/ {print $2; exit}' helm/bettercamsur/Chart.yaml)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            CHART_VERSION="${GITHUB_REF_NAME#v}"
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            CHART_VERSION="${BASE_VERSION}-sha.${SHORT_SHA}"
            APP_VERSION="sha-${SHORT_SHA}"
          fi
          mkdir -p dist
          helm package ./helm/bettercamsur \
            --version "${CHART_VERSION}" \
            --app-version "${APP_VERSION}" \
            --destination dist
          helm push "dist/bettercamsur-${CHART_VERSION}.tgz" \
            "oci://ghcr.io/${OWNER}/charts"
